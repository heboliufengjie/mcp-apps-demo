<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP Apps 本地宿主</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0b1020;
        --panel: #121a2e;
        --panel-2: #0e1527;
        --line: #243049;
        --ink: #e6e9f2;
        --muted: #8b96ad;
        --brand: #7c8cff;
        --brand-2: #22d3ee;
        --ok: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(1200px 600px at 85% -10%, #1b2a52 0%, transparent 60%),
          var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 14px;
      }

      .layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 20px;
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px;
      }

      aside {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.01em;
      }

      .lede {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .panel {
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .kv {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr);
        gap: 6px 10px;
        font-size: 12px;
      }

      .kv dt {
        color: var(--muted);
      }

      .kv dd {
        margin: 0;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      label {
        display: block;
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 12px;
      }

      select,
      button {
        width: 100%;
        font: inherit;
        border-radius: 10px;
      }

      select {
        padding: 10px 12px;
        color: var(--ink);
        background: var(--panel-2);
        border: 1px solid var(--line);
      }

      button {
        margin-top: 12px;
        padding: 11px 14px;
        border: 0;
        color: #0a1020;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: progress;
      }

      .log {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 7px;
        max-height: 260px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.5;
      }

      .log li {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
        gap: 8px;
        color: var(--muted);
      }

      .log .who {
        color: var(--brand-2);
      }

      .log .who.app {
        color: var(--ok);
      }

      main {
        min-width: 0;
      }

      .chat {
        min-height: calc(100vh - 48px);
        background:
          linear-gradient(180deg, rgb(255 255 255 / 4%), transparent 30%),
          var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .chat-head {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }

      .dot.live {
        background: var(--ok);
        box-shadow: 0 0 0 4px rgb(52 211 153 / 12%);
      }

      .bubble {
        max-width: 72%;
        padding: 12px 14px;
        border-radius: 14px;
        background: #1a2440;
        border: 1px solid var(--line);
        color: #c9d2e6;
        font-size: 13px;
      }

      .bubble.user {
        align-self: flex-end;
        background: #26345c;
        color: #eef2ff;
      }

      .frame-wrap {
        flex: none;
        min-height: 640px;
        border-radius: 16px;
        background: #f5f7fb;
        overflow: hidden;
        border: 1px solid var(--line);
        position: relative;
      }

      .frame-wrap iframe {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 640px;
        border: 0;
        background: #f5f7fb;
      }

      .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #667085;
        text-align: center;
        font-size: 13px;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        background: #10192d;
      }

      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
      }

      pre {
        margin: 10px 0 0;
        max-height: 220px;
        overflow: auto;
        color: #b8c3da;
        font-size: 11.5px;
        line-height: 1.5;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          padding: 14px;
        }

        .chat {
          min-height: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <div>
          <h1>MCP Apps 本地宿主</h1>
          <p class="lede">
            宿主通过 MCP 调用工具，读取 <code>ui://</code> 资源，在沙箱 iframe
            中用官方 <code>AppBridge</code> 完成握手与数据注入。
          </p>
        </div>

        <section class="panel">
          <h2>工具</h2>
          <dl class="kv">
            <dt>名称</dt>
            <dd id="tool-name">—</dd>
            <dt>resourceUri</dt>
            <dd id="tool-uri">—</dd>
            <dt>MIME</dt>
            <dd id="resource-mime">—</dd>
            <dt>状态</dt>
            <dd id="tool-state">加载中</dd>
          </dl>
          <label for="period" style="margin-top: 14px">统计周期</label>
          <select id="period">
            <option value="month">本月</option>
            <option value="quarter">本季度</option>
            <option value="year">本年</option>
          </select>
          <button id="run" type="button" disabled>调用工具并渲染</button>
        </section>

        <section class="panel">
          <h2>协议事件</h2>
          <ol class="log" id="log"></ol>
        </section>

        <details>
          <summary>最近一次 tools/call 原始结果</summary>
          <pre id="raw-result">—</pre>
        </details>
      </aside>

      <main>
        <div class="chat">
          <div class="chat-head">
            <span class="dot" id="live-dot"></span>
            <span id="chat-state">等待宿主就绪</span>
          </div>
          <div class="bubble">请展示本月销售数据，用表格和图表。</div>
          <div class="frame-wrap" id="frame-wrap">
            <div class="empty" id="empty">
              点击左侧「调用工具并渲染」<br />
              这里会出现 MCP 工具返回的可视化界面
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/host.js"></script>
  </body>
</html>

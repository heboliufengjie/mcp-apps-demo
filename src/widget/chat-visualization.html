<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Microsoft YaHei",
          sans-serif;
        color: #e8e8e8;
        background: #202020;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 8px 0;
      }

      .blocks {
        display: grid;
        gap: 12px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }

      .metric,
      .card,
      .callout,
      .compare > section {
        background: #282828;
        border: 1px solid #3a3a3a;
        border-radius: 12px;
        padding: 14px;
      }

      .metric span,
      .metric small {
        display: block;
        color: #aaa;
      }

      .metric strong {
        display: block;
        font-size: 23px;
        margin: 4px 0;
      }

      .metric small {
        color: #67c391;
      }

      h3,
      h4,
      p {
        margin: 0 0 8px;
      }

      h3 {
        font-size: 15px;
      }

      .card {
        overflow: auto;
      }

      .card table {
        border-collapse: collapse;
        width: 100%;
        min-width: 360px;
      }

      .card th,
      .card td {
        padding: 8px 10px;
        text-align: left;
        border-bottom: 1px solid #3a3a3a;
      }

      .card th {
        color: #aaa;
        font-weight: 500;
      }

      .callout {
        border-left: 3px solid #7087ff;
      }

      .callout p {
        margin: 0;
      }

      .timeline {
        margin: 0;
        padding-left: 24px;
      }

      .timeline li {
        margin: 8px 0;
      }

      .timeline time {
        color: #aaa;
        margin-left: 8px;
      }

      .compare {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .compare ul {
        margin: 0;
        padding-left: 18px;
      }

      pre {
        white-space: pre-wrap;
        overflow: auto;
        margin: 0;
      }

      .divider {
        border: 0;
        border-top: 1px solid #444;
        width: 100%;
      }

      .chart svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .chart text {
        fill: #aaa;
        font-size: 11px;
      }

      .chart .grid {
        stroke: #3c3c3c;
      }

      .chart .series {
        fill: #7087ff;
        stroke: #7087ff;
      }

      .chart .line {
        fill: none;
        stroke: #7087ff;
        stroke-width: 3;
      }
    </style>
  </head>

  <body>
    <main id="blocks" class="blocks" aria-live="polite"></main>
    <!-- WIDGET_SCRIPT -->
  </body>
</html>

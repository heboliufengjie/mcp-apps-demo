<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>销售数据看板</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --card: #ffffff;
        --ink: #101828;
        --muted: #667085;
        --line: #eaecf0;
        --brand: #4f46e5;
        --brand-soft: #eef2ff;
        --up: #067647;
        --up-soft: #ecfdf3;
        --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 8px 24px rgb(16 24 40 / 6%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      .page {
        max-width: 880px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.01em;
      }

      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .badge {
        flex: none;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--brand-soft);
        color: var(--brand);
        font-weight: 600;
        font-size: 13px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: var(--shadow);
      }

      .stat-label {
        color: var(--muted);
        font-size: 12px;
      }

      .stat-value {
        margin-top: 4px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }

      .stat-delta {
        margin-top: 2px;
        font-size: 12px;
        color: var(--up);
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        box-shadow: var(--shadow);
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
      }

      #chart {
        display: block;
        width: 100%;
        height: auto;
      }

      .bar {
        opacity: 0;
        animation: grow 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: bottom;
      }

      @keyframes grow {
        from {
          opacity: 0;
          transform: scaleY(0.2);
        }
        to {
          opacity: 1;
          transform: scaleY(1);
        }
      }

      .chart-value {
        fill: var(--muted);
        font-size: 11px;
        text-anchor: middle;
        font-variant-numeric: tabular-nums;
      }

      .chart-label {
        fill: var(--muted);
        font-size: 12px;
        text-anchor: middle;
      }

      .grid-line {
        stroke: var(--line);
        stroke-width: 1;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }

      th,
      td {
        padding: 10px 8px;
        text-align: right;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      th:first-child,
      td:first-child {
        text-align: left;
        padding-left: 4px;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .delta {
        display: inline-block;
        min-width: 56px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--up-soft);
        color: var(--up);
        font-size: 12px;
        font-weight: 600;
      }

      .delta.negative {
        background: #fef3f2;
        color: #b42318;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 4px;
        color: var(--muted);
        font-size: 12px;
      }

      #status[data-tone="error"] {
        color: #b42318;
      }

      .skeleton {
        background: linear-gradient(90deg, #f0f2f6 25%, #e7eaf0 37%, #f0f2f6 63%);
        background-size: 400% 100%;
        animation: shimmer 1.4s ease infinite;
        border-radius: 8px;
        height: 12px;
      }

      @keyframes shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: 0 0;
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 12px;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div>
          <h1>销售数据看板</h1>
          <p class="subtitle">由 MCP 工具返回 structuredContent，宿主渲染成表格与图表</p>
        </div>
        <span class="badge" id="period-badge">加载中</span>
      </header>

      <section class="stats" aria-label="核心指标">
        <article class="stat">
          <div class="stat-label">销售额</div>
          <div class="stat-value" id="stat-revenue">—</div>
          <div class="stat-delta" id="stat-growth">—</div>
        </article>
        <article class="stat">
          <div class="stat-label">订单量</div>
          <div class="stat-value" id="stat-orders">—</div>
          <div class="stat-delta">来自 MCP structuredContent</div>
        </article>
        <article class="stat">
          <div class="stat-label">覆盖区域</div>
          <div class="stat-value" id="stat-regions">—</div>
          <div class="stat-delta">按销售额排序</div>
        </article>
      </section>

      <section class="card">
        <h2>区域销售额</h2>
        <svg id="chart" viewBox="0 0 720 260" role="img" aria-label="各区域销售额柱状图"></svg>
      </section>

      <section class="card">
        <h2>区域明细</h2>
        <table id="sales-table">
          <thead>
            <tr>
              <th>区域</th>
              <th>销售额</th>
              <th>订单量</th>
              <th>同比</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4"><div class="skeleton" style="width: 100%"></div></td>
            </tr>
          </tbody>
        </table>
      </section>

      <footer>
        <span id="status">等待宿主发送工具结果…</span>
        <span>MCP Apps · ui://sales/dashboard.html</span>
      </footer>
    </main>

    <script type="module">
      import {
        App,
        PostMessageTransport,
      } from "/vendor/app-with-deps.js";

      const money = new Intl.NumberFormat("zh-CN", {
        style: "currency",
        currency: "CNY",
        maximumFractionDigits: 0,
      });
      const integer = new Intl.NumberFormat("zh-CN");
      const wn = (value) => `${(value / 10000).toFixed(0)}万`;

      const statusEl = document.getElementById("status");

      function setStatus(text, tone) {
        statusEl.textContent = text;
        if (tone) statusEl.dataset.tone = tone;
        else delete statusEl.dataset.tone;
      }

      function renderChart(rows) {
        const svg = document.getElementById("chart");
        svg.replaceChildren();

        const W = 720;
        const H = 260;
        const pad = { top: 30, right: 16, bottom: 44, left: 16 };
        const innerW = W - pad.left - pad.right;
        const innerH = H - pad.top - pad.bottom;
        const max = Math.max(...rows.map((row) => row.revenue));

        const ns = "http://www.w3.org/2000/svg";
        const defs = document.createElementNS(ns, "defs");
        const gradient = document.createElementNS(ns, "linearGradient");
        gradient.setAttribute("id", "bar-gradient");
        gradient.setAttribute("x1", "0");
        gradient.setAttribute("y1", "0");
        gradient.setAttribute("x2", "0");
        gradient.setAttribute("y2", "1");
        gradient.innerHTML =
          '<stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a5b4fc"/>';
        defs.append(gradient);
        svg.append(defs);

        for (let i = 0; i <= 3; i += 1) {
          const y = pad.top + (innerH / 3) * i;
          const line = document.createElementNS(ns, "line");
          line.setAttribute("x1", String(pad.left));
          line.setAttribute("x2", String(W - pad.right));
          line.setAttribute("y1", String(y));
          line.setAttribute("y2", String(y));
          line.classList.add("grid-line");
          svg.append(line);
        }

        const slot = innerW / rows.length;
        const barW = Math.min(72, slot * 0.5);

        rows.forEach((row, index) => {
          const x = pad.left + slot * index + (slot - barW) / 2;
          const height = Math.max(6, (row.revenue / max) * innerH);
          const y = pad.top + innerH - height;

          const bar = document.createElementNS(ns, "rect");
          bar.setAttribute("class", "bar");
          bar.setAttribute("x", String(x));
          bar.setAttribute("y", String(y));
          bar.setAttribute("width", String(barW));
          bar.setAttribute("height", String(height));
          bar.setAttribute("rx", "8");
          bar.setAttribute("fill", "url(#bar-gradient)");
          bar.style.animationDelay = `${index * 55}ms`;
          svg.append(bar);

          const value = document.createElementNS(ns, "text");
          value.setAttribute("class", "chart-value");
          value.setAttribute("x", String(x + barW / 2));
          value.setAttribute("y", String(y - 8));
          value.textContent = wn(row.revenue);
          svg.append(value);

          const label = document.createElementNS(ns, "text");
          label.setAttribute("class", "chart-label");
          label.setAttribute("x", String(x + barW / 2));
          label.setAttribute("y", String(H - 16));
          label.textContent = row.region;
          svg.append(label);
        });
      }

      function renderTable(rows) {
        const tbody = document.querySelector("#sales-table tbody");
        tbody.replaceChildren();

        rows.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.region}</td>
            <td>${money.format(row.revenue)}</td>
            <td>${integer.format(row.orders)}</td>
            <td><span class="delta${row.growth < 0 ? " negative" : ""}">${row.growth > 0 ? "+" : ""}${row.growth.toFixed(1)}%</span></td>
          `;
          tbody.append(tr);
        });
      }

      function render(data) {
        document.getElementById("period-badge").textContent = data.label;
        document.getElementById("stat-revenue").textContent = money.format(
          data.totalRevenue,
        );
        document.getElementById("stat-growth").textContent =
          `同比 ${data.growth > 0 ? "+" : ""}${data.growth.toFixed(1)}%`;
        document.getElementById("stat-orders").textContent = integer.format(
          data.orders,
        );
        document.getElementById("stat-regions").textContent = String(
          data.rows.length,
        );
        renderChart(data.rows);
        renderTable(data.rows);
        setStatus(
          `已渲染 ${data.rows.length} 行 · 数据来自 ui/notifications/tool-result`,
        );
        document.documentElement.dataset.rendered = "true";
      }

      const app = new App(
        { name: "sales-dashboard", version: "1.0.0" },
        {},
        { autoResize: true },
      );

      app.ontoolinput = (params) => {
        const period = params.arguments?.period ?? "month";
        setStatus(`MCP 工具已调用：period=${period}，等待工具结果…`);
      };

      app.ontoolresult = (result) => {
        let data = result.structuredContent;
        if (!data) {
          const text = result.content?.find((item) => item.type === "text");
          try {
            data = text?.type === "text" ? JSON.parse(text.text) : undefined;
          } catch {
            data = undefined;
          }
        }

        if (!data || !Array.isArray(data.rows)) {
          setStatus("工具结果中没有可渲染的 structuredContent", "error");
          return;
        }

        render(data);
      };

      await app.connect(
        new PostMessageTransport(window.parent, window.parent),
      );
    </script>
  </body>
</html>
